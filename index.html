<title>Speaking Expressions Quiz</title>
<style>

--bg:#fdf8f1;--card:#fff;--text:#2b2433;--muted:#7a7085;--line:#e8dfd3;--accent:#ff7a59;--good:#2fa86b;--goodbg:#e3f6ec;--bad:#d9453b;--badbg:#fde8e6;--ill1:#ffe7c2;--ill2:#ffc9d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1a22;--card:#2a2630;--text:#f3eef7;--muted:#a69db1;--line:#403a48;--accent:#ff8d6e;--good:#5ad39a;--goodbg:#1f3a2e;--bad:#ff7d73;--badbg:#412426;--ill1:#4a3a2c;--ill2:#4a2e3a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1a22;--card:#2a2630;--text:#f3eef7;--muted:#a69db1;--line:#403a48;--accent:#ff8d6e;--good:#5ad39a;--goodbg:#1f3a2e;--bad:#ff7d73;--badbg:#412426;--ill1:#4a3a2c;--ill2:#4a2e3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:18px 16px 32px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.count{font-size:14px;font-weight:700;color:var(--muted);min-width:48px;text-align:right}
.ill{border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--line);user-select:none;line-height:0}.ill svg{width:100%;height:auto;display:block}
.ill span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.ill span:nth-child(2){animation-delay:.3s}.ill span:nth-child(3){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.ill span{animation:none}}
.q{font-size:22px;line-height:1.45;font-weight:800;margin:22px 4px 18px;text-align:center}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);color:var(--accent);padding:0 6px;transition:all .2s}
.blank.done{color:var(--good);border-color:var(--good)}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:18px;font-weight:700;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:transform .1s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt:hover{border-color:var(--accent)}
.opt.good{background:var(--goodbg);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opts.lock .opt{pointer-events:none}
.next{margin-top:18px;width:100%;font:inherit;font-size:18px;font-weight:800;padding:15px;border:0;border-radius:16px;background:var(--accent);color:#fff;cursor:pointer;visibility:hidden}
.next.show{visibility:visible}
.lbl{font-weight:800;color:var(--muted);margin:18px 4px 8px;font-size:14px}.seg{display:flex;gap:8px}.seg button{flex:1;font:inherit;font-weight:800;font-size:16px;padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}.seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}.chip{font-size:14px;font-weight:800;color:var(--good);background:var(--goodbg);padding:4px 10px;border-radius:99px;white-space:nowrap}.nav{display:flex;gap:10px;margin-top:18px}.nav .next{margin-top:0;flex:1;width:auto}.prev{font:inherit;font-size:18px;font-weight:800;padding:15px 18px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;visibility:hidden}.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 18px}.dots b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}.dots .g{background:var(--good)}.dots .r{background:var(--bad)}.end{text-align:center;padding-top:40px}
.end .big{font-size:90px}
.end h1{font-size:30px;margin:10px 0 4px}
.end p{color:var(--muted);font-size:18px;margin:0 0 24px}
</style>
</head>

['#ffe3d3','#a8d5a2',R(135,70,16,98,BR)+C(143,60,44,'#5fb36b')+P(60,70,{k:.85,a:'right'})+P(240,70,{k:.85,a:'left',c:'#ff9f43',f:'long',h:'#7a3b1e'})],
['#cfe8c8','#6fae66',R(50,14,200,86,'#2f6b4f',6)+R(46,100,208,6,BR)+P(100,70,{k:.9,c:'#e8505b',a:'right'})+P(200,70,{k:.9,c:'#4f8cff',f:'bun',h:'#5a3a2a',s:SK[2]})]
];
function scene(k,n){var S=HINT?SC[k]:NS[n%NS.length];return '<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">'+R(0,0,300,190,S[0])+R(0,168,300,22,S[1])+S[2]+'</svg>'}
var app=document.getElementById('app'),Q,i,score,A,OR;
function menu(){
 var cnt=[5,10,15,D.length];
 app.innerHTML='<div class="ill">'+scene('',0)+'</div><div class="q">Speaking Expressions Quiz</div>'
 +'<div class="lbl">Random questions</div><div class="seg" id="sg1">'+cnt.map(function(c){return '<button data-v="'+c+'" class="'+(c==N?'on':'')+'">'+(c==D.length?'All '+c:c)+'</button>'}).join('')+'</div>'
 +'<div class="lbl">Illustration</div><div class="seg" id="sg2"><button data-v="0" class="'+(HINT?'':'on')+'">Neutral</button><button data-v="1" class="'+(HINT?'on':'')+'">Matches the answer</button></div>'
 +'<button class="next show" id="go" style="margin-top:22px">Start</button>';
 seg('sg1',function(v){N=+v});seg('sg2',function(v){HINT=v=='1'});
 document.getElementById('go').onclick=start;
}
function seg(id,f){var b=document.getElementById(id);b.onclick=function(e){var t=e.target;if(t.tagName!='BUTTON')return;[].forEach.call(b.children,function(x){x.classList.remove('on')});t.classList.add('on');f(t.dataset.v)}}
function start(){Q=shuf(D).slice(0,N);i=0;score=0;A=[];OR=[];show()}
function show(){
 var d=Q[i],parts=d[1].split('___');
 app.innerHTML='<div class="top"><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="count">'+(i+1)+' / '+Q.length+'</div><div class="chip" id="chip">✓ '+score+'</div></div>'
 +'<div class="ill">'+scene(d[2],i)+'</div>'
 +'<div class="q">'+parts[0]+'<span class="blank" id="bl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'+parts[1]+'</div>'
 +'<div class="opts" id="opts"></div><div class="nav"><button class="prev" id="pv">Back</button><button class="next" id="nx"></button></div>';
 var box=document.getElementById('opts');
 OR[i]=OR[i]||shuf(d.slice(2));OR[i].forEach(function(o){
  var b=document.createElement('button');b.className='opt';b.textContent=o;
  b.onclick=function(){pick(b,o)};box.appendChild(b)});var pv=document.getElementById('pv');pv.style.visibility=i?'visible':'hidden';pv.onclick=function(){i--;show()};if(A[i]!==undefined)pick(null,A[i],1);
}
function pick(b,o,re){var ok=o===Q[i][2];
 var d=Q[i],box=document.getElementById('opts');box.classList.add('lock');
 [].forEach.call(box.children,function(x){if(x.textContent===d[2])x.classList.add('good')});
 if(!re){A[i]=o;if(ok)score++}if(!ok)[].forEach.call(box.children,function(x){if(x.textContent===o)x.classList.add('bad')});var ch=document.getElementById('chip');if(ch)ch.textContent='✓ '+score;
 var bl=document.getElementById('bl');bl.textContent=d[2].toLowerCase()===d[2]?d[2]:d[2].charAt(0).toLowerCase()+d[2].slice(1);
 if(/^(Commute|Flustered)$/.test(d[2]))bl.textContent=d[2].toLowerCase();
 bl.classList.add('done');
 var n=document.getElementById('nx');n.textContent=i<Q.length-1?'Next':'See result';n.classList.add('show');
 n.onclick=function(){i++;i<Q.length?show():end()};
}
function end(){
 var p=score/Q.length,e=p>.8?'🏆':p>.5?'🎉':'💪';
 app.innerHTML='<div class="end"><div class="big">'+e+'</div><h1>'+score+' / '+Q.length+'</h1><div class="dots">'+Q.map(function(q,k){return '<b class="'+(A[k]===q[2]?'g':'r')+'">'+(k+1)+'</b>'}).join('')+'</div><p>'+(p>.8?'Excellent speaking skills!':p>.5?'Nice work, keep practising!':'Good start, try again!')+'</p><button class="next show" id="re">Play again</button></div>';
 document.getElementById('re').onclick=start;
}
start();
</script>
